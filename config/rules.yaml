# rules.yaml — пороги движка ставок. ВСЁ здесь тюнится на живых логах.
# TACoS — РАТИО (0.08 = 8%), в тех же единицах, что compute_tacos.
# Старт консервативный + dry_run=true: бот считает и логирует, но НЕ шлёт PUT,
# пока владелец не проверит решения глазами.

# --- Коридор окупаемости (медленный контур) ---
target_tacos_low: 0.08     # ниже — реклама дёшево окупается, можно поднять ставку
target_tacos_high: 0.15    # выше — окупаемость плохая, снижаем

# --- Тормозной (быстрый) контур ---
daily_sku_cost_limit: 3000     # ФОЛБЭК ₸/сутки на SKU, если бюджет кампании недоступен
sku_budget_fraction: 0.5       # лимит на SKU = доля дневного бюджета кампании (dailyBudget)
min_clicks_for_no_cart_cut: 40 # резать «0 корзин» только после стольких кликов (не на 5)
cpc_spike_pct: 0.5             # avgCpc подскочил > 50% к прошлому снапшоту → срезать шаг

# --- Ограничители изменений ---
max_bid_step: 2            # макс. шаг изменения ставки за тик, ₸
max_changes_per_day: 3     # макс. изменений на SKU в сутки
bid_ceiling: 50            # потолок ставки, ₸
min_bid: 1                 # пол ставки, ₸
min_score_for_raise: 4.0   # низкий score → НЕ задираем ставку (плохой товар в рекламе)

# --- Предохранитель вывода ---
dry_run: true              # true = решения только логируются, PUT не отправляется
