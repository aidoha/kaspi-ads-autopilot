# positions.yaml — что трекаем в поиске Kaspi.
# product_id — id карточки Kaspi (последняя числовая группа в URL карточки).
# zone — НЕОБЯЗАТЕЛЬНО: Kaspi делит выдачу только по city_id (c=<id>), зону игнорит.
#        Пустая строка ("") = параметр зоны не отправляется (это норм). Не пустой,
#        но неверный токен даёт 400 — поэтому по умолчанию оставляем "".
max_depth: 100
cities:
  - {name: "Алматы", city_id: "750000000", zone: ""}
  - {name: "Астана", city_id: "710000000", zone: ""}
track:
  # product_id заменить на id нашей карточки (жду ссылку от владельца).
  - {keyword: "аэрогриль", product_id: "REPLACE_ME", label: "Наш товар"}
